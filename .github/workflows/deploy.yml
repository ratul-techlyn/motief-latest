name: Deploy to Hostinger VPS

# Every push to production deploys wemotif.com. It can also be started by hand from the Actions tab.
on:
  push:
    branches: [production]
  workflow_dispatch:

# Never run two deploys at the same time; a newer push waits for the running one
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE_DIR: /home/motifadmin/htdocs/wemotif.com
  ENV_FILE: /home/motifadmin/envs/wemotif.env
  PORT: "3333"
  PM2_NAME: wemotif-com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: refuses to connect if the server's identity ever changes
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port ${{ secrets.SSH_PORT || '22' }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Upload code (rsync)
        # Same rules as deploy.sh: server-side .env*, .next and node_modules are never touched,
        # and the WordPress install is protected.
        run: |
          rsync -az --delete \
            --filter='protect childs/' --filter='protect childs/**' \
            --exclude='.env*' --exclude='.next/' --exclude='node_modules/' \
            --exclude='.git/' --exclude='.github/' --exclude='*.zip' \
            --exclude='.agents/' --exclude='.claude/' \
            ./ deploy-target:"$SITE_DIR/"

      - name: Install, build and restart
        run: |
          ssh deploy-target "SITE_DIR='$SITE_DIR' ENV_FILE='$ENV_FILE' PORT='$PORT' PM2_NAME='$PM2_NAME' bash -s" <<'REMOTE'
          set -euo pipefail

          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 22 >/dev/null
          echo "Node $(node -v)"

          cd "$SITE_DIR"

          # Production env lives outside the web root and is linked in (as in deploy.sh)
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::Env file missing at $ENV_FILE"
            exit 1
          fi
          ln -sfn "$ENV_FILE" .env.production

          npm ci --no-audit --no-fund
          npm run build

          command -v pm2 >/dev/null || npm install -g pm2
          if pm2 describe "$PM2_NAME" >/dev/null 2>&1; then
            pm2 reload "$PM2_NAME" --update-env
          else
            pm2 start npm --name "$PM2_NAME" -- start
          fi
          pm2 save
          REMOTE

      - name: Health check
        run: |
          ssh deploy-target "PORT='$PORT' bash -s" <<'REMOTE'
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/" || true)
            case "$code" in
              2*|3*) echo "Site is responding (HTTP $code)"; exit 0 ;;
            esac
            sleep 3
          done
          echo "::error::Site did not respond on port $PORT (last HTTP code: $code)"
          pm2 logs --nostream --lines 40 || true
          exit 1
          REMOTE
